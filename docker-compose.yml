services:
  postgres:
    image: postgres:16-alpine
    container_name: orreris-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: orreris
      POSTGRES_PASSWORD: orreris
      POSTGRES_DB: orreris
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orreris -d orreris"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: orreris-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]

volumes:
  postgres_data:
  redis_data:
