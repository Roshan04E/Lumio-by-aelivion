packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  ffmpeg-static: true
  msgpackr-extract: true
  # Node-only transitive deps of kokoro-js/@huggingface/transformers — the browser uses
  # onnxruntime-web, so their native build scripts are never needed here.
  onnxruntime-node: false
  prisma: true
  protobufjs: false
  sharp: false
