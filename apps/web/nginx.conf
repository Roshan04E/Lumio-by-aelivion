# Orreris web — serves the built SPA and (for a single-host deploy) proxies API + media to the API.
#
# Upstream is the docker-compose service name `api` on :4100. If you deploy web and api on SEPARATE
# hosts, build the web image with VITE_API_URL set to the API's absolute https URL and you can ignore
# / remove these proxy blocks (the SPA will call the API directly).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA routing: serve the requested file, else fall back to the app shell.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Same-origin API proxy (matches the default build arg VITE_API_URL=/api). proxy_pass without a
  # path preserves the /api/ prefix the API mounts its routes under. Uploads/exports can be large.
  location /api/ {
    proxy_pass http://api:4100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 2g;
    proxy_read_timeout 3600s;
  }

  # Media proxy (served by the API's /storage route for a private bucket). Range must pass through so
  # the editor scrubber + video seeking get 206 partial responses instead of full-file downloads.
  location /storage/ {
    proxy_pass http://api:4100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Range $http_range;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
